name: CareThread
options:
  bundleIdPrefix: io.8xd
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  OCRBench:
    build:
      targets:
        CareThread: all
        OCRBenchTests: [test]
    test:
      config: Debug
      targets:
        - name: OCRBenchTests
  DeviceSimAcceptance:
    build:
      targets:
        CareThread: all
        CareThreadDeviceSimUITests: [test]
    test:
      config: Debug
      targets:
        - name: CareThreadDeviceSimUITests
targets:
  CareThread:
    type: application
    platform: iOS
    sources:
      - path: CareThread
      - path: docs/legal/PRIVACY_POLICY.md
        buildPhase: resources
      - path: docs/legal/TERMS_OF_SERVICE.md
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    info:
      path: CareThread/Resources/Info.plist
      properties:
        CFBundleDisplayName: CareThread
        CFBundleLocalizations:
          - zh-Hans
        NSBonjourServices:
          - "_carethread._tcp"
        NSCameraUsageDescription: "拍摄纸质报告需要使用相机。照片只会保存在这台手机上。"
        NSCalendarsFullAccessUsageDescription: "只有在你主动选择“加入系统日历”时，CareThread 才会把复查安排写入日历。"
        NSFaceIDUsageDescription: "用面容 ID 保护你的健康资料。"
        NSLocalNetworkUsageDescription: "在你主动发起换机时，通过本地网络把所选家人的资料加密传到另一台 iPhone。"
        NSPhotoLibraryUsageDescription: "通过系统照片选择器读取你明确选中的报告截图。所选照片只会保存在这台手机上。"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.8xd.carethread
        PRODUCT_NAME: CareThread
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - CareThreadTests
        - CareThreadUITests
      gatherCoverageData: true
  CareThreadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CareThreadTests
    dependencies:
      - target: CareThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.8xd.carethread.tests
        GENERATE_INFOPLIST_FILE: YES
  CareThreadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CareThreadUITests
        excludes:
          - DeviceSimulatorAcceptanceUITests.swift
    dependencies:
      - target: CareThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.8xd.carethread.uitests
        GENERATE_INFOPLIST_FILE: YES
  CareThreadDeviceSimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CareThreadUITests/DeviceSimulatorAcceptanceUITests.swift
      - path: CareThreadUITests/UITestTyping.swift
    dependencies:
      - target: CareThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.8xd.carethread.device-sim-ui-tests
        GENERATE_INFOPLIST_FILE: YES
  OCRBenchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Benchmarks/OCRBench/SimulatorTests
      - path: Benchmarks/OCRBench/testset/manifest.json
        buildPhase: resources
      - path: Benchmarks/OCRBench/testset/images
        buildPhase: resources
    dependencies:
      - target: CareThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.8xd.carethread.ocrbench
        GENERATE_INFOPLIST_FILE: YES
