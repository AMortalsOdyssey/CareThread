name: CareThread
options:
  bundleIdPrefix: me.multiego
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CareThread:
    type: application
    platform: iOS
    sources:
      - path: CareThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.multiego.carethread
        PRODUCT_NAME: CareThread
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CareThread
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "拍摄纸质报告需要使用相机。照片只会保存在这台手机上。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "从相册导入报告截图需要访问照片。所选照片只会保存在这台手机上。"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "用面容 ID 保护你的健康资料。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "保存导出的就诊摘要需要写入所选位置。"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - CareThreadTests
        - CareThreadUITests
      gatherCoverageData: true
  CareThreadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CareThreadTests
    dependencies:
      - target: CareThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.multiego.carethread.tests
        GENERATE_INFOPLIST_FILE: YES
  CareThreadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CareThreadUITests
    dependencies:
      - target: CareThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.multiego.carethread.uitests
        GENERATE_INFOPLIST_FILE: YES

